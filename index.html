<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger: expenses and invoices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F6F3FF; --card:#FFFFFF; --ink:#1E1A33; --ink2:#5D5878; --ink3:#8B86A6;
  --line:#E7E1F8; --line2:#D5CCF2; --accent:#7C5CF0; --accent-ink:#FFFFFF; --accent-soft:#EEE9FF;
  --hero:#7C5CF0; --hero-ink:#FFFFFF; --hero-sub:#E3DBFF; --chip:#F1EDFC;
  --danger:#D63B57; --danger-soft:#FDECEF; --warn:#A06400; --warn-soft:#FFF3DA; --ok:#1F8A4C; --ok-soft:#E6F6EC;
  --radius:24px; --shadow:0 1px 2px rgba(60,40,120,.05),0 6px 20px rgba(60,40,120,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Space Grotesk',system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;padding:24px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:18px;padding:4px 12px 20px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left;color:var(--ink2);font-weight:500}
.navbtn:hover{background:var(--line)}
.navbtn.on{background:var(--accent-soft);color:var(--accent)}
.navbtn svg{width:19px;height:19px;flex:none}
.badge{margin-left:auto;background:var(--danger);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:600}
main{padding:28px 32px 120px;max-width:980px;width:100%}
.syncnote{font-size:12.5px;color:var(--ink3);margin-top:auto;padding:12px}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--ink2);margin:0 0 20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.stat .lbl{font-size:13px;color:var(--ink2)}
.card.hero{background:var(--hero);border-color:var(--hero)}
.card.hero .lbl,.card.hero .hint{color:var(--hero-sub)}
.card.hero .val{color:var(--hero-ink)}
.card.hero .up{color:#FFB4C0}.card.hero .down{color:#A8F0C6}
.stat .val{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.stat .hint{font-size:12.5px;color:var(--ink3);margin-top:2px}
.up{color:var(--danger)} .down{color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:6px 10px;font-size:13.5px}
.btn[disabled]{opacity:.5;cursor:default}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:color-mix(in srgb,var(--line) 40%,transparent)}
.dot{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff}
.item .main{flex:1;min-width:0}
.item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{text-align:right;font-weight:600;white-space:nowrap}
.item .amt small{display:block;font-weight:400;color:var(--ink3);font-size:12.5px}
.daylabel{font-size:12.5px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:16px 4px 4px}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.st-draft{background:var(--line);color:var(--ink2)} .st-sent{background:var(--accent-soft);color:var(--accent)}
.st-paid{background:var(--ok-soft);color:var(--ok)} .st-overdue{background:var(--danger-soft);color:var(--danger)}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;margin-bottom:16px;font-size:14px}
.banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.bad{background:var(--danger-soft);color:var(--danger)} .banner.info{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;color:var(--ink2);padding:36px 12px}
.empty svg.mascot{display:block;margin:0 auto 10px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2);font-weight:500}
input.i,select.i,textarea.i{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-size:15px;color:var(--ink)}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);border-color:var(--accent)}
textarea.i{min-height:70px;resize:vertical}
.big{font-size:28px!important;font-weight:600;padding:12px 14px!important}
.err{color:var(--danger);font-size:13px;min-height:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:7px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink2)}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{padding:7px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.cat i{width:9px;height:9px;border-radius:50%;display:inline-block}
.cat.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.bar .v{text-align:right;font-weight:600}
.cols{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.cols .col{width:100%;max-width:46px;border-radius:8px 8px 3px 3px;background:var(--line2)}
.cols .c.cur .col{background:var(--accent)}
.cols .c span{font-size:12px;color:var(--ink3)}
.cols .c b{font-size:11.5px;font-weight:600;color:var(--ink2)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:600;color:var(--ink2);font-size:12.5px;padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t .r{text-align:right}
.overlay{position:fixed;inset:0;background:rgba(30,20,60,.35);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:18px;width:100%;max-width:560px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet.wide{max-width:900px}
.sheet h2{font-size:19px;margin-bottom:16px}
.fields{display:grid;gap:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px}
.actions .left{margin-right:auto}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 58px 96px 30px;gap:8px;align-items:center}
.line .tot{display:none}
.invgrid{display:grid;gap:18px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
.line .tot{text-align:right;font-weight:500;font-size:14px}
.lhead{font-size:12px;color:var(--ink3);font-weight:600}
.invprev{background:#fff;color:#1d1c1a;border:1px solid var(--line);border-radius:12px;padding:26px;font-size:13.5px}
.invprev h3{margin:0;font-size:22px;letter-spacing:.04em}
.invprev .muted{color:#77746d}
.invprev table{width:100%;border-collapse:collapse;margin:16px 0}
.invprev th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:#77746d;border-bottom:1px solid #e3e0d9;padding:6px 4px}
.invprev td{padding:8px 4px;border-bottom:1px solid #efece6}
.invprev .r{text-align:right}
.invprev .pay{display:flex;gap:18px;align-items:flex-start;border-top:1px solid #e3e0d9;padding-top:14px;margin-top:6px}
.invprev canvas{width:118px;height:118px;image-rendering:pixelated;border:1px solid #eee;border-radius:6px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.app{grid-template-columns:1fr}
nav.side{display:none}
main{margin:0 auto;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40;justify-content:center;gap:4px}
.mnav button{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;font-size:12px;color:var(--ink3);padding:7px 0;cursor:pointer;position:relative;border-radius:10px}
.mnav button:hover{color:var(--ink)}
.mnav button.on{color:var(--accent)}
.mnav svg{width:22px;height:22px}
.mnav .badge{position:absolute;top:2px;right:28%;margin:0}
.fab{display:grid;place-items:center;position:fixed;right:max(18px,calc(50% - 470px));bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:0 8px 24px rgba(139,124,246,.35);z-index:45;cursor:pointer}
.fab svg{width:26px;height:26px}
.receipt{max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--line);display:block}
.muted{color:var(--ink3)}
.small{font-size:13px}
.ratesrow{display:grid;grid-template-columns:90px 1fr 32px;gap:8px;align-items:center}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{display:none}
  main{padding:18px 16px calc(110px + env(safe-area-inset-bottom));}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40;justify-content:space-around}
  .mnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;font-size:11px;color:var(--ink3);padding:6px 0;cursor:pointer;position:relative}
  .mnav button.on{color:var(--accent)}
  .mnav svg{width:22px;height:22px}
  .mnav .badge{position:absolute;top:0;right:22%;margin:0}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:0 8px 24px rgba(139,124,246,.35);z-index:45;cursor:pointer}
  .fab svg{width:26px;height:26px}
  .overlay{padding:0;align-items:flex-end}
  .sheet{border-radius:18px 18px 0 0;max-height:94vh;overflow:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
  .line{grid-template-columns:minmax(0,1fr) 52px 84px 28px}
  .invgrid{grid-template-columns:1fr}
  .lhead .hide-m{display:none}
  .bar{grid-template-columns:96px minmax(0,1fr) 90px;font-size:13px}
  .f3{grid-template-columns:1fr 1fr}
  .f3>:first-child{grid-column:1/-1}
  .invprev{padding:16px}
  .hide-m{display:none}
}

/* Brand kit, violet */
h1{font-size:30px;font-weight:700;letter-spacing:-.03em}
h2{font-weight:600;letter-spacing:-.01em}
.card{border-radius:24px;padding:20px 22px;box-shadow:var(--shadow)}
.card.hero{background:var(--hero);border-color:var(--line)}
.card.hero .val{color:var(--hero-ink)}
.card.hero .up{color:#FFD3DB}.card.hero .down{color:#C9F5D9}
.stat .val{font-size:32px;font-weight:700;letter-spacing:-.03em}
.btn{border-radius:999px;background:var(--chip);border-color:var(--chip);color:var(--ink);font-weight:600;padding:10px 18px}
.btn:hover{border-color:var(--line2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:7px 13px}
.tab,.cat{background:transparent;border-color:var(--line)}
.tab.on{background:var(--accent-soft);color:var(--ink);border:1.5px solid var(--accent)}
.cat.on{background:var(--accent-soft);color:var(--ink);border:1.5px solid var(--accent)}
input.i,select.i,textarea.i{border-radius:14px;background:var(--chip);border-color:var(--line)}
.sheet{border-radius:28px}
.dot{border-radius:999px}
.banner{border-radius:18px}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.chip.st-sent{background:var(--accent-soft);color:var(--accent)}
.toast{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-weight:600}
.fab{border-radius:999px}
.mnav button{border-radius:999px;color:var(--ink3)}
.mnav button.on{background:var(--accent-soft);color:var(--ink)}
.mnav button.on svg{color:var(--accent)}
.cols .c.cur .col{background:var(--accent)}
.logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:14px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo i{width:36px;height:36px;border-radius:12px;background:var(--accent);display:grid;place-items:center}
.logo svg{width:20px;height:20px}

/* Motion */
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes sheetUp{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
@keyframes sheetDown{from{opacity:1;transform:none}to{opacity:0;transform:translateY(28px) scale(.98)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,122,138,.55)}50%{box-shadow:0 0 0 6px rgba(255,122,138,0)}}
@keyframes zz{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.03)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
@keyframes ring{0%{transform:scale(.4);opacity:0}40%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes drawCheck{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
@keyframes spark{0%{transform:rotate(var(--a)) translateY(0) scale(1);opacity:1}100%{transform:rotate(var(--a)) translateY(-70px) scale(.3);opacity:0}}
@keyframes burstOut{0%,70%{opacity:1}100%{opacity:0}}
#view.enter{animation:viewIn .32s cubic-bezier(.2,.8,.2,1)}
#view.enter .card,#view.enter .banner{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
#view.enter .card:nth-child(2){animation-delay:.04s}#view.enter .card:nth-child(3){animation-delay:.08s}
#view.enter .bar .fill{transform-origin:left;animation:growX .7s cubic-bezier(.2,.8,.2,1) both .1s}
#view.enter .cols .col{transform-origin:bottom;animation:growY .7s cubic-bezier(.2,.8,.2,1) both}
#view.enter .cols .c:nth-child(2) .col{animation-delay:.05s}#view.enter .cols .c:nth-child(3) .col{animation-delay:.1s}#view.enter .cols .c:nth-child(4) .col{animation-delay:.15s}#view.enter .cols .c:nth-child(5) .col{animation-delay:.2s}#view.enter .cols .c:nth-child(6) .col{animation-delay:.25s}
.overlay{animation:fadeIn .18s ease-out}
.overlay .sheet{animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
.overlay.closing{animation:fadeOut .18s ease-in forwards}
.overlay.closing .sheet{animation:sheetDown .18s ease-in forwards}
.btn,.tab,.cat,.mnav button,.fab,.item{transition:transform .12s ease,background-color .15s ease,border-color .15s ease,color .15s ease}
.btn:active,.tab:active,.cat:active,.mnav button:active{transform:scale(.95)}
.fab:hover{transform:translateY(-2px)}.fab:active{transform:scale(.92)}
.item:active{transform:scale(.99)}
.badge{animation:pulse 2s ease-in-out infinite}
.toast{animation:rise .22s cubic-bezier(.2,.8,.2,1)}
.mascot{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 90%}
.mascot.sleep{animation:breathe 3s ease-in-out infinite}
.mascot .zz{animation:zz 2.4s ease-in-out infinite}
.hello{display:flex;align-items:center;justify-content:space-between;gap:16px}
.burst{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:90;animation:burstOut 1s ease forwards}
.burst .b{position:relative;width:96px;height:96px}
.burst .circ{position:absolute;inset:0;border-radius:50%;background:var(--accent);display:grid;place-items:center;animation:ring .35s cubic-bezier(.2,1.4,.4,1) both}
.burst svg{width:48px;height:48px}
.burst path{stroke-dasharray:40;stroke-dashoffset:40;animation:drawCheck .3s .2s ease-out forwards}
.burst i{position:absolute;left:44px;top:44px;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:spark .7s .1s cubic-bezier(.2,.8,.2,1) both}
.burst i:nth-child(odd){background:#F2C26B}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.scan{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:18px;border:1.5px dashed var(--line2);background:var(--accent-soft);color:var(--ink);font-weight:600;cursor:pointer;transition:transform .12s ease,border-color .15s ease}
.scan:hover{border-color:var(--accent)}.scan:active{transform:scale(.98)}
.scan svg{width:22px;height:22px;color:var(--accent)}
.scan.busy{opacity:.7;pointer-events:none}
.scan.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:12.5px;color:var(--accent);margin-top:6px;min-height:16px}
.budgets{display:flex;flex-direction:column;gap:14px}
.bud .top{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:6px}
.bud .top b{font-weight:600}
.bud .top span{color:var(--ink2);font-size:13px}
.bud .track{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bud .fill{height:100%;border-radius:999px;background:var(--accent)}
.bud.warn .fill{background:var(--warn)} .bud.over .fill{background:var(--danger)}
.bud.warn .top span{color:var(--warn)} .bud.over .top span{color:var(--danger)}
#view.enter .bud .fill{transform-origin:left;animation:growX .7s cubic-bezier(.2,.8,.2,1) both .15s}
.budrow{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center}
.budrow span{display:flex;align-items:center;gap:8px}
.budrow i{width:10px;height:10px;border-radius:50%;display:inline-block}

.aisum{background:var(--accent-soft);border-radius:18px;padding:14px 16px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;margin-top:12px}
.aisum.wait{color:var(--ink2)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:4px 0 14px}
.tile{background:var(--chip);border-radius:18px;padding:12px 14px}
.tile .k{font-size:12.5px;color:var(--ink2)}
.tile .v{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.tile .d{font-size:12px;color:var(--ink3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recap{background:var(--accent-soft);border-radius:18px;padding:16px 18px;line-height:1.6;font-size:14.5px}
.recap .tips{margin:8px 0 0;padding-left:18px}
.recap .thinking{color:var(--ink2)}
.recap .thinking::after{content:"";display:inline-block;width:1em;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.summhead{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}

body.signin .mnav,body.signin .fab{display:none!important}
.signin-wrap{max-width:420px;margin:8vh auto 0;text-align:center}
.signin-wrap .card{text-align:left;margin-top:18px}

function init(){

    var db = r[0], user = r[1];
    if(!db || !user){ useLocal("Sign in to sync across devices. Saving on this device only."); return; }
    return user.id().then(function(uid){
      if(!uid){ useLocal("Sign in to sync across devices. Saving on this device only."); return; }
      store.db = db; store.uid = uid; store.col = db.collection("data/users/"+uid);
      var settled = false, createdSettings = false;
      var timer = setTimeout(function(){ if(!settled){ store.note = "Can't reach your saved data yet. Showing what's loaded."; render(); } }, 10000);
      store.col.onSnapshot(function(snap){
        var docs = snap.docs.map(function(d){ return d.data(); });
        applyDocs(docs);
        if(!snap.metadata.fromCache){
          settled = true; clearTimeout(timer); store.mode = "cloud"; store.note = "";
          if(!S.settings && !createdSettings){ createdSettings = true; put(defaultSettings()); }
        }
        render();
      }, function(err){
        clearTimeout(timer);
        if(store.mode !== "cloud"){ store.col = null; useLocal("Cloud sync isn't available here. Saving on this device only."); }
        else { store.note = "Sync stopped. Reload the page to reconnect."; render(); }
      });
    });
  }).catch(function(){ useLocal("Saving on this device only."); });
}

function animateCounts(root){

function suggestCategory(merchant){

  var best=null; Object.keys(counts).forEach(function(k){ if(best===null||counts[k]>counts[best]) best=k; });
  if(best && !cats().some(function(c){ return c.name===best; })) return null;

}

function monthStats(m){
  var pm = shiftMonth(m,-1);

  var total = ex.reduce(function(a,e){ return a+(e.home||0); },0), prev = monthTotal(pm);

  var cats_ = Object.keys(byCat).sort(function(a,b){ return byCat[b]-byCat[a]; }).map(function(k){ return {name:k, amount:byCat[k], share: total?Math.round(byCat[k]/total*100):0}; });
  var biggest = ex.slice().sort(function(a,b){ return (b.home||0)-(a.home||0); })[0] || null;
  var t = today(), days = monthOf(t)===m ? +t.slice(8,10) : new Date(+m.slice(0,4), +m.slice(5,7), 0).getDate();

  var issued = S.invoices.filter(function(i){ return monthOf(i.issueDate||"")===m && i.status!=="draft"; });

  var toHome = function(i){ var r=rateFor(i.currency); return Math.round(invTotal(i)*(isFinite(r)?r:0)); };
  return { month:m, total:total, prev:prev, count:ex.length, perDay: days?Math.round(total/days):0, days:days, cats:cats_, biggest:biggest,
    foreignCount:foreign.length, foreignCurrencies: Object.keys(foreign.reduce(function(o,e){ o[e.currency]=1; return o; },{})),
    budgets: budgetRows(m), issuedCount:issued.length, issuedTotal:issued.reduce(function(a,i){ return a+toHome(i); },0),
    paidCount:paid.length, paidTotal:paid.reduce(function(a,i){ return a+toHome(i); },0),

}
function recapLines(st){
  var L = [];
  if(!st.count) L.push("No expenses logged in "+monthLabel(st.month)+" yet.");
  else {
    var line = "You spent "+money(st.total)+" across "+st.count+" expense"+(st.count===1?"":"s")+", about "+money(st.perDay)+" a day";
    if(st.prev){ var d = Math.round((st.total-st.prev)/st.prev*100); line += ", "+(d===0?"the same as":(Math.abs(d)+"% "+(d>0?"more than":"less than")))+" "+monthLabel(shiftMonth(st.month,-1),true); }
    L.push(line+".");
    if(st.cats.length) L.push("Most went on "+st.cats[0].name+" ("+money(st.cats[0].amount)+", "+st.cats[0].share+"%)"+(st.cats[1]?", then "+st.cats[1].name+" ("+money(st.cats[1].amount)+")":"")+".");
    if(st.biggest) L.push("Biggest single expense: "+(st.biggest.merchant||st.biggest.category)+", "+money(st.biggest.home)+" on "+shortDate(st.biggest.date)+".");
    if(st.foreignCount) L.push(st.foreignCount+" expense"+(st.foreignCount===1?" was":"s were")+" in "+st.foreignCurrencies.join(", ")+".");
  }
  var over = st.budgets.filter(function(b){ return b.state==="over"; }), warn = st.budgets.filter(function(b){ return b.state==="warn"; });
  if(st.budgets.length){
    if(over.length) L.push("Over budget: "+over.map(function(b){ return b.name+" ("+money(b.spent-b.limit)+" over)"; }).join(", ")+".");
    if(warn.length) L.push("Close to budget: "+warn.map(function(b){ return b.name+" ("+b.pct+"%)"; }).join(", ")+".");
    if(!over.length && !warn.length) L.push("All "+st.budgets.length+" budget"+(st.budgets.length===1?" is":"s are")+" on track.");
  }
  if(st.issuedCount || st.paidCount) L.push("Invoices: "+st.issuedCount+" sent ("+money(st.issuedTotal)+"), "+st.paidCount+" paid ("+money(st.paidTotal)+").");
  if(st.overdue.length) L.push(st.overdue.length+" invoice"+(st.overdue.length===1?" is":"s are")+" overdue, with "+money(st.owed)+" still owed to you.");
  return L;
}

function toJpeg(file, maxSide, q){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight; if(!w || !h){ URL.revokeObjectURL(url); rej(); return; }
      var sc = Math.min(1, maxSide/Math.max(w,h)), cv = document.createElement("canvas");
      cv.width = Math.round(w*sc); cv.height = Math.round(h*sc);
      var ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){ b ? res(b) : rej(); }, "image/jpeg", q);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
function shrinkImage(file, maxSide, q){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, maxSide/Math.max(w,h));
      var cv = document.createElement("canvas"); cv.width = Math.round(w*sc); cv.height = Math.round(h*sc);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      var out = cv.toDataURL("image/jpeg", q);
      if(out.length > 240000) out = cv.toDataURL("image/jpeg", 0.4);
      res(out);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

/* ---------- PayNow SGQR ---------- */
function tlv(id, v){ v = String(v); return id + String(v.length).padStart(2,"0") + v; }
function crc16(str){
  var crc = 0xFFFF;
  for(var i=0;i<str.length;i++){ crc ^= str.charCodeAt(i) << 8; for(var j=0;j<8;j++){ crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1); crc &= 0xFFFF; } }
  return crc.toString(16).toUpperCase().padStart(4,"0");
}
function cleanAscii(s, n){ return String(s||"").normalize("NFKD").replace(/[^\x20-\x7E]/g,"").trim().slice(0,n); }
function paynowPayload(d){
  var s = settings(); var proxy = String(s.paynowId||"").replace(/\s+/g,"");
  if(s.paynowType!=="uen"){ proxy = proxy.replace(/[^0-9+]/g,""); if(/^\d{8}$/.test(proxy)) proxy = "+65"+proxy; else if(/^65\d{8}$/.test(proxy)) proxy = "+"+proxy; }
  else proxy = proxy.toUpperCase();
  var mai = tlv("00","SG.PAYNOW") + tlv("01", s.paynowType==="uen"?"2":"0") + tlv("02", proxy) + tlv("03","0");
  var p = tlv("00","01") + tlv("01","12") + tlv("26", mai) + tlv("52","0000") + tlv("53","702") + tlv("54", (invTotal(d)/100).toFixed(2)) +
    tlv("58","SG") + tlv("59", cleanAscii(payerText(s),25) || "NA") + tlv("60","Singapore") + tlv("62", tlv("01", cleanAscii(d.number,25) || "INVOICE"));
  p += "6304";
  return p + crc16(p);
}
function qrMatrix(text){
  if(typeof window.qrcode !== "function") return null;
  var q = window.qrcode(0, "M"); q.addData(text); q.make();
  var n = q.getModuleCount(), m = [];
  for(var r=0;r<n;r++){ var row=[]; for(var c=0;c<n;c++) row.push(q.isDark(r,c)); m.push(row); }
  return m;
}
function drawQr(cv, d, scale){
  var m = qrMatrix(paynowPayload(d)); scale = scale || 6;
  if(!m){ var ctx0 = cv.getContext("2d"); cv.width = 120; cv.height = 120; ctx0.fillStyle="#fff"; ctx0.fillRect(0,0,120,120); ctx0.fillStyle="#999"; ctx0.font="11px sans-serif"; ctx0.fillText("QR unavailable", 18, 62); return false; }
  var n = m.length, q = 4, size = (n+q*2)*scale;
  cv.width = size; cv.height = size; var ctx = cv.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,size,size);
  ctx.fillStyle = "#7c1a78";
  for(var r=0;r<n;r++) for(var c=0;c<n;c++) if(m[r][c]) ctx.fillRect((c+q)*scale,(r+q)*scale,scale,scale);
  return true;
}

/* ---------- PDF ---------- */
function downloadPdf(d, client){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast("The PDF tool didn't load. Check your connection and reload."); return; }

  var s = settings(), doc = new window.jspdf.jsPDF({ unit:"pt", format:"a4" });

  doc.setFont("helvetica","bold"); doc.setFontSize(18); txt(payerText(s), L, y);
  doc.setFontSize(22); txt("INVOICE", R, y, {align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(110);
  var fromLines = doc.splitTextToSize((s.address||"") + (s.email ? "\n"+s.email : ""), 260);
  txt(fromLines.join("\n"), L, y+18);
  txt(d.number, R, y+18, {align:"right"});
  y += 34 + Math.max(1, fromLines.length)*12;
  doc.setTextColor(110); doc.setFontSize(9); txt("BILL TO", L, y);
  txt("ISSUED", R-110, y); txt("DUE", R, y, {align:"right"});
  doc.setTextColor(20); doc.setFontSize(11); doc.setFont("helvetica","bold"); txt(client ? client.name : "", L, y+15);
  doc.setFont("helvetica","normal"); txt(shortDate(d.issueDate), R-110, y+15); doc.setFont("helvetica","bold"); txt(shortDate(d.dueDate), R, y+15, {align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(90);
  var toLines = doc.splitTextToSize((client && client.address) || "", 260); if(client && client.email) toLines.push(client.email);
  if(toLines.length) txt(toLines.join("\n"), L, y+29);
  y += 44 + toLines.length*12;
  doc.setDrawColor(220); doc.setTextColor(110); doc.setFontSize(9);
  txt("DESCRIPTION", L, y); txt("QTY", 360, y, {align:"right"}); txt("PRICE", 450, y, {align:"right"}); txt("AMOUNT", R, y, {align:"right"});
  y += 8; doc.line(L, y, R, y); y += 16;
  doc.setTextColor(20); doc.setFontSize(10.5);
  d.lines.forEach(function(l){
    var desc = doc.splitTextToSize(l.d||"", 270);
    if(y + desc.length*13 > 760){ doc.addPage(); y = 64; }
    txt(desc.join("\n"), L, y); txt(String(l.q), 360, y, {align:"right"}); txt(money(l.p||0,d.currency), 450, y, {align:"right"});
    txt(money(Math.round((Number(l.q)||0)*(l.p||0)), d.currency), R, y, {align:"right"});
    y += desc.length*13 + 8; doc.setDrawColor(235); doc.line(L, y-4, R, y-4); y += 8;
  });
  y += 6; doc.setFontSize(10); doc.setTextColor(110); txt("Total due", 420, y, {align:"right"});
  doc.setFontSize(15); doc.setTextColor(20); doc.setFont("helvetica","bold"); txt(money(invTotal(d), d.currency), R, y+1, {align:"right"});
  doc.setFont("helvetica","normal");
  y += 34;
  var showQr = d.currency===HOME && s.paynowId;
  if(y > 640){ doc.addPage(); y = 64; }
  if(showQr || s.bankAcct){
    doc.setDrawColor(220); doc.line(L, y, R, y); y += 22;
    var tx = L;
    if(showQr){
      var cv = document.createElement("canvas");
      if(drawQr(cv, d, 8)){ doc.addImage(cv.toDataURL("image/png"), "PNG", L, y-6, 120, 120); doc.setFontSize(8.5); doc.setTextColor(110); txt("PayNow", L+60, y+124, {align:"center"}); tx = L + 140; }
    }
    doc.setFontSize(11); doc.setTextColor(20); doc.setFont("helvetica","bold"); txt("How to pay", tx, y+6); doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(80);
    var pay = [];
    if(showQr) pay.push("Scan the QR code with any Singapore banking app.", "The amount and reference fill in automatically.", "");
    if(s.bankAcct) pay.push("Bank transfer", (s.bankHolder||payerText(s)), (s.bankName||"")+" "+s.bankAcct, "");
    pay.push("Reference: "+d.number);
    txt(pay.join("\n"), tx, y+22);
    y += 150;
  }
  if(d.notes){ if(y > 740){ doc.addPage(); y = 64; } doc.setFontSize(10); doc.setTextColor(90); txt(doc.splitTextToSize(d.notes, R-L).join("\n"), L, y); }
  var blob = doc.output("blob");
  store.downloads.save({ filename: (d.number||"invoice") + ".pdf", data: blob }).then(function(){ toast("PDF saved"); }).catch(function(e){ if(e && e.code==="declined") return; toast("Couldn't save the PDF."); });
}

/* ---------- export / backup ---------- */
function csvCell(v){ v = String(v==null?"":v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function saveFile(name, data){
  if(!store.downloads){ toast("Downloads aren't available in this view."); return; }
  store.downloads.save({ filename:name, data:data }).then(function(){ toast("File saved"); }).catch(function(e){ if(e && e.code==="declined") return; toast("Couldn't save the file."); });
}
function exportCsv(){
  var rows = [["Date","Merchant","Category","Currency","Amount","Rate (SGD per unit)","Amount SGD","Note","Receipt"]];
  S.expenses.slice().sort(function(a,b){ return a.date.localeCompare(b.date); }).forEach(function(e){
    rows.push([e.date, e.merchant, e.category, e.currency, (e.amount/100).toFixed(2), e.rate, (e.home/100).toFixed(2), e.note, e.hasReceipt?"yes":""]);
  });
  saveFile("expenses-"+today()+".csv", rows.map(function(r){ return r.map(csvCell).join(","); }).join("\n"));
}
function backup(){
  var data = { app:"ledger", version:1, exportedAt:new Date().toISOString(), settings:S.settings, expenses:S.expenses, invoices:S.invoices, clients:S.clients };
  saveFile("ledger-backup-"+today()+".json", JSON.stringify(data, null, 2));
}
function restore(file){
  var r = new FileReader();
  r.onload = function(){
    var data; try { data = JSON.parse(r.result); } catch(e){ toast("That file isn't a valid backup."); return; }
    if(!data || data.app!=="ledger"){ toast("That file isn't a Ledger backup."); return; }
    var docs = [].concat(data.expenses||[], data.invoices||[], data.clients||[], data.settings?[data.settings]:[]).filter(function(x){ return x && x.id && x.kind; });
    confirmBox("Restore "+docs.length+" records from this backup? Records with the same ID will be replaced; nothing else is deleted.", "Restore").then(function(ok){
      if(!ok) return;
      var p = Promise.resolve();
      docs.forEach(function(doc){ p = p.then(function(){ return put(doc); }); });
      p.then(function(){ toast("Backup restored"); });
    });
  };
  r.readAsText(file);
}

  ov.addEventListener("mousedown", function(ev){ if(ev.target===ov) closeModal(); });
  ov.addEventListener("click", function(ev){ if(ev.target.closest("[data-close]")) closeModal(); });
  $("#modal").appendChild(ov); modalStack.push(ov); document.body.style.overflow = "hidden";
  return ov;
}
function closeModal(){ var ov = modalStack.pop(); if(ov){ ov.classList.add("closing"); setTimeout(function(){ ov.remove(); }, 180); } if(!modalStack.length) document.body.style.overflow = ""; }
document.addEventListener("keydown", function(ev){ if(ev.key==="Escape" && modalStack.length) closeModal(); });
function confirmBox(msg, okLabel){
  return new Promise(function(res){
    var ov = openModal('<p style="margin:0 0 4px;font-size:16px">'+esc(msg)+'</p><div class="actions"><button class="btn" id="cb-no">Cancel</button><button class="btn primary" id="cb-yes">'+esc(okLabel||"OK")+'</button></div>');
    $("#cb-no",ov).onclick = function(){ closeModal(); res(false); };
    $("#cb-yes",ov).onclick = function(){ closeModal(); res(true); };
  });
}
function dateBox(msg, val){
  return new Promise(function(res){
    var ov = openModal('<h2>'+esc(msg)+'</h2><input class="i" type="date" id="db-d" value="'+esc(val)+'"><div class="err" id="db-e"></div><div class="actions"><button class="btn" id="db-no">Cancel</button><button class="btn primary" id="db-yes">Confirm</button></div>');
    $("#db-no",ov).onclick = function(){ closeModal(); res(null); };
    $("#db-yes",ov).onclick = function(){ var v = $("#db-d",ov).value; if(!v){ $("#db-e",ov).textContent="Pick a date."; return; } closeModal(); res(v); };
  });
}

/* ---------- global events ---------- */
document.addEventListener("click", function(ev){
  var t = ev.target;
  var g = t.closest("[data-go]"); if(g){ go(g.getAttribute("data-go")); return; }
  var a = t.closest("[data-act]");
  if(a){
    var act = a.getAttribute("data-act");
    if(act==="add-expense") openExpense(null);
    else if(act==="new-invoice") openInvoice(null);
    else if(act==="month-prev"){ ui.month = shiftMonth(ui.month,-1); render(); }
    else if(act==="month-next"){ ui.month = shiftMonth(ui.month,1); render(); }
    else if(act==="rep-prev"){ ui.repMonth = shiftMonth(ui.repMonth,-1); render(); }
    else if(act==="rep-next"){ ui.repMonth = shiftMonth(ui.repMonth,1); render(); }
    else if(act==="exp-csv") exportCsv();
    else if(act==="sync-now") syncNow();
    else if(act==="set-password") openSetPassword();
    else if(act==="signout"){
      var pendN = store.outbox.length;
      confirmBox(pendN ? "You have "+pendN+" change"+(pendN===1?"":"s")+" that haven't uploaded yet. If you sign out now they'll be lost. Sign out anyway?" : "Sign out of Ledger on this device?", "Sign out").then(function(ok){
        if(!ok) return;
        try { localStorage.removeItem(sbKey("cache")); localStorage.removeItem(sbKey("outbox")); } catch(e){}
        store.outbox = [];
        store.sb.auth.signOut({ scope:"local" }).then(function(){ sbSignedOut(); }, function(){ sbSignedOut(); });
      });
    }
    else if(act==="local-only"){ ev.preventDefault(); useLocal("Saving on this device only. Reload to sign in."); }
    else if(act==="ai-recap"){ if(!(recaps[ui.repMonth]&&recaps[ui.repMonth].busy)) writeRecap(ui.repMonth); }
    else if(act==="report-pdf") downloadReport();
    else if(act==="backup") backup();
    else if(act==="add-cat"){
      var n = $("#newcat").value.trim(); if(!n) return;
      if(cats().some(function(c){ return c.name.toLowerCase()===n.toLowerCase(); })){ toast("That category already exists"); return; }
      var s = JSON.parse(JSON.stringify(settings())); s.categories = cats().slice(); s.categories.splice(s.categories.length-1, 0, {name:n, color:$("#newcatc").value}); put(s); toast("Category added");
    }
    else if(act==="add-rate"){
      var code = $("#newcur").value.trim().toUpperCase(), rv = parseFloat($("#newrate").value);
      if(!/^[A-Z]{3}$/.test(code)){ toast("Use a 3-letter currency code"); return; }
      if(code===HOME){ toast("SGD is your home currency"); return; }
      if(!(rv>0)){ toast("Enter how many SGD one "+code+" buys"); return; }
      try { new Intl.NumberFormat("en",{style:"currency",currency:code}); } catch(e){ toast("Unknown currency code"); return; }
      var s2 = JSON.parse(JSON.stringify(settings())); s2.rates[code] = rv; put(s2); toast(code+" added");
    }
    return;
  }
  var ex = t.closest("[data-edit-exp]"); if(ex){ openExpense(ex.getAttribute("data-edit-exp")); return; }
  var iv = t.closest("[data-edit-inv]"); if(iv){ openInvoice(iv.getAttribute("data-edit-inv")); return; }
  var ec = t.closest("[data-expcat]"); if(ec){ ui.expCat = ec.getAttribute("data-expcat"); render(); return; }
  var it = t.closest("[data-invtab]"); if(it){ ui.invTab = it.getAttribute("data-invtab"); render(); return; }
  var dc = t.closest("[data-delcat]"); if(dc){
    var ix = +dc.getAttribute("data-delcat"), cs = cats().slice(), nm = cs[ix].name;
    confirmBox("Remove the "+nm+" category? Existing expenses keep their category name.", "Remove").then(function(ok){ if(!ok) return; var s = JSON.parse(JSON.stringify(settings())); cs.splice(ix,1); s.categories = cs; put(s); });
    return;
  }
  var dr = t.closest("[data-delrate]"); if(dr){
    var code2 = dr.getAttribute("data-delrate"); var s3 = JSON.parse(JSON.stringify(settings())); delete s3.rates[code2]; put(s3); return;
  }
});
document.addEventListener("input", function(ev){
  if(ev.target.id==="expq"){ ui.expQ = ev.target.value; var pos = ev.target.selectionStart; render(); var el = $("#expq"); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} } }
});
$("#fab").addEventListener("click", function(){ openExpense(null); });

init();
})();
</script>
